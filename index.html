<style>
/* Same type system as the VET-ENERGY Daily Operation Record: IBM Plex Sans (English) + Noto Sans Khmer (Khmer). */
:root {
  --bg: #f4f6fa; --surface: #ffffff; --ink: #101c2c; --muted: #56657a; --line: #d8dfea;
  --accent: #003665; --accent-ink: #ffffff; --accent-soft: #e4ecf6; --band: #003665; --band-ink: #ffffff; --gold: #e3b44a; --gold-ink: #2a1d00; --tabbar: #e9eef6;
  --ok: #23794a; --ok-soft: #dff1e5; --warn: #9a5d06; --warn-soft: #fbeed3; --crit: #b3362b; --crit-soft: #fae1dd; --idle: #7c8b96;
  --font-display: "IBM Plex Sans Condensed", "Noto Sans Khmer", "Arial Narrow", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Noto Sans Khmer", "Khmer OS Battambang", "Segoe UI", system-ui, sans-serif;
  --font-print: "IBM Plex Sans", "Khmer OS Siemreap", "Noto Sans Khmer", "Khmer UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c131d; --surface: #141e2b; --ink: #e5ecf5; --muted: #93a3b8; --line: #263447;
    --accent: #7fb0e6; --accent-ink: #061a30; --accent-soft: #15263b; --band: #04254a; --band-ink: #eef4fb; --tabbar: #111c29;
    --ok: #6cc68e; --ok-soft: #173826; --warn: #e3ac4d; --warn-soft: #3d2f12; --crit: #f08478; --crit-soft: #44201c; --idle: #8497a3;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 16px 16px 56px; display: flex; flex-direction: column; gap: 16px; }
.band { background: var(--band); color: var(--band-ink); }
.band .inner { max-width: 1440px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand-logo { display: inline-flex; align-items: center; background: #fff; border-radius: 8px; padding: 5px 10px; line-height: 0; }
.brand-logo img { height: 36px; width: auto; display: block; }
.brand h1 { font-family: var(--font-display); font-size: 24px; line-height: 1.1; margin: 0; color: var(--band-ink); }
.brand .kh { font-size: 13px; opacity: .8; font-family: var(--font-body); }
@media (max-width: 640px) { .brand-logo img { height: 26px; } .brand h1 { font-size: 19px; } }
.who { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.role-chip { background: var(--gold); color: var(--gold-ink); border-radius: 12px; padding: 2px 10px; font-weight: 600; font-size: 12px; }
.band .btn.ghost { color: var(--band-ink); border-color: color-mix(in srgb, var(--band-ink) 40%, transparent); background: transparent; }
.band .btn.ghost:hover { background: color-mix(in srgb, var(--band-ink) 12%, transparent); }
.dot { display: inline-flex; align-items: center; gap: 6px; }
.dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
.dot.ok::before { background: #6fd39a; } .dot.busy::before { background: var(--gold); } .dot.err::before { background: #ff8a7d; }
.tabbar { background: var(--tabbar); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.tabbar .inner { max-width: 1440px; margin: 0 auto; padding: 8px 16px; }
nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
nav.tabs button { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 5px 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  box-shadow: 0 1px 2px rgba(16,24,40,.08); line-height: 1.2; }
nav.tabs button small { font-weight: 400; color: var(--muted); font-size: 11.5px; }
nav.tabs button:hover { box-shadow: 0 4px 10px rgba(0,54,101,.18); }
nav.tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
nav.tabs button.on small { color: color-mix(in srgb, var(--accent-ink) 75%, transparent); }
.ti { font-size: 1.15em; vertical-align: -2px; }
h2 { font-family: var(--font-display); font-size: 21px; margin: 0; }
h2 .kh, h3 .kh { font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: .72em; margin-left: 6px; }
h3 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
.head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.head p { margin: 2px 0 0; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.card.tight { padding: 12px; }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; border-top: 4px solid var(--accent); }
.kpi .l { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
.kpi .l .kh { display: block; text-transform: none; letter-spacing: 0; font-weight: 400; }
.kpi .v { font-family: var(--font-display); font-size: 25px; line-height: 1.15; font-variant-numeric: tabular-nums; margin-top: 4px; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi.ok { border-top-color: var(--ok); } .kpi.warn { border-top-color: var(--gold); } .kpi.crit { border-top-color: var(--crit); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 45%, transparent); }
.btn.small { padding: 3px 8px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
label.f .kh { font-weight: 400; }
input, select, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 9px; min-height: 34px; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 0; border-color: var(--accent); }
textarea { min-height: 60px; resize: vertical; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 14px; }
.form .wide { grid-column: 1 / -1; }
table { border-collapse: collapse; width: 100%; }
.tbl-wrap { overflow-x: auto; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); position: sticky; top: 0; }
th .kh { display: block; font-weight: 400; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.c, th.c { text-align: center; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--accent-soft); }
tr.tot td { font-weight: 600; border-top: 2px solid var(--ink); }
tr.void td { color: var(--muted); text-decoration: line-through; }
.pill { display: inline-block; border-radius: 10px; padding: 1px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.p-Paid, .p-Applied { background: var(--ok-soft); color: var(--ok); }
.p-Overdue, .p-Rejected { background: var(--crit-soft); color: var(--crit); }
.p-Unpaid, .p-Suspended, .p-Transferred { background: var(--warn-soft); color: var(--warn); }
.p-Check { background: #ece6fb; color: #5a3bb0; }
.p-Void { background: var(--line); color: var(--muted); }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .neg { color: var(--crit); } .pos { color: var(--ok); }
.notice { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; max-width: min(680px, 92vw); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.notice.bad { background: var(--crit); color: #fff; } .notice.good { background: var(--ok); color: #fff; }
.modal-bg { position: fixed; inset: 0; background: rgba(8,16,28,.5); z-index: 40; display: flex; align-items: flex-start; justify-content: center; padding: 4vh 12px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 14px; width: min(980px, 100%); padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.modal.narrow { width: min(520px, 100%); }
.modal .mh { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.modal .mf { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.err { color: var(--crit); font-weight: 600; min-height: 1.2em; }
.sub { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.sub button { background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 6px 10px; cursor: pointer; font-weight: 600; color: var(--muted); }
.sub button.on { color: var(--accent); border-bottom-color: var(--accent); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 8px; font-size: 13px; }
.dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
.dl dt { color: var(--muted); font-size: 12.5px; } .dl dd { margin: 0; }
.chart-box { position: relative; height: 290px; }
.login { max-width: 420px; margin: 8vh auto; }
.hide { display: none !important; }
.perm td, .perm th { text-align: center; } .perm td:first-child { text-align: left; }
.ln-grid td { padding: 4px; } .ln-grid input, .ln-grid select { width: 100%; }
.empty { padding: 26px; text-align: center; color: var(--muted); }
.skel { display: inline-block; height: 1em; border-radius: 6px; background: linear-gradient(90deg, var(--line) 25%, color-mix(in srgb, var(--line) 40%, var(--surface)) 50%, var(--line) 75%); background-size: 200% 100%; animation: skel 1.3s linear infinite; width: 100%; }
@keyframes skel { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.loadcard { display: flex; gap: 16px; align-items: center; border-left: 4px solid var(--gold); }
.spin { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.ldbar { height: 6px; background: var(--accent-soft); border-radius: 4px; margin: 8px 0 4px; overflow: hidden; }
.ldbar span { display: block; height: 100%; background: var(--accent); transition: width .4s ease; }

/* ------------------------------------------------ print: invoices, receipts, reports (A4, Khmer + English) */
#print { display: none; }
@media print {
  @page { size: A4; margin: 10mm; }
  body { background: #fff; }
  #app, .notice, .modal-bg, #login { display: none !important; }
  #print { display: block; }
}
.doc { font-family: var(--font-print); color: #111; font-size: 11px; background: #fff; width: 190mm; margin: 0 auto; }
.doc.land { width: 277mm; }
.doc + .doc { break-before: page; }
.doc .dh { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; border-bottom: 2px solid #003665; padding-bottom: 8px; }
.doc .dh img { height: 46px; }
.doc .org { text-align: right; font-size: 10px; color: #333; line-height: 1.5; }
.doc .org b { font-size: 12px; color: #003665; }
.doc .dt { text-align: center; margin: 12px 0 10px; }
.doc .dt .k { font-size: 17px; font-weight: 600; color: #003665; }
.doc .dt .e { font-size: 15px; font-weight: 600; letter-spacing: .12em; color: #003665; }
.doc .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 24px; margin-bottom: 10px; }
.doc .meta div { display: grid; grid-template-columns: 44% 56%; gap: 6px; padding: 2px 0; border-bottom: 1px dotted #c9d2de; }
.doc .meta span:first-child { color: #445; }
.doc table th { background: #003665; color: #fff; font-size: 10px; position: static; border: 1px solid #003665; padding: 4px 5px; }
.doc table th .kh { color: #dbe6f3; } .doc table th .kh + br { display: none; }
.doc table td { border: 1px solid #c9d2de; padding: 4px 5px; font-size: 10.5px; }
.doc table tr.tot td { background: #eef3f9; border-top: 2px solid #003665; }
.doc .stamp { display: inline-block; border: 2px solid; border-radius: 6px; padding: 3px 10px; font-weight: 700; font-size: 12px; transform: rotate(-4deg); }
.doc .stamp.Paid { color: #23794a; } .doc .stamp.Overdue { color: #b3362b; } .doc .stamp.Unpaid { color: #9a5d06; }
.doc .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 40px; text-align: center; }
.doc .sign.three { grid-template-columns: 1fr 1fr 1fr; }
.doc .sign div { border-top: 1px solid #333; padding-top: 4px; }
.doc .foot { margin-top: 14px; font-size: 9.5px; color: #555; display: flex; justify-content: space-between; border-top: 1px solid #c9d2de; padding-top: 4px; }
.doc h4 { color: #003665; margin: 14px 0 6px; font-size: 12px; border-left: 4px solid #e3b44a; padding-left: 6px; }
.doc .kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }
.doc .kv div { border: 1px solid #c9d2de; border-radius: 6px; padding: 6px; }
.doc .kv b { display: block; font-size: 14px; color: #003665; }
/* invoice & receipt in the layout of the sample workbook */
.sdoc { font-size: 11.5px; }
.sdoc .sh { display: flex; gap: 14px; align-items: center; }
.sdoc .sh img { height: 58px; }
.sdoc .sh-t { flex: 1; text-align: center; font-size: 9.5px; line-height: 1.45; color: #2F5496; }
.sdoc .sh-kh { font-size: 15px; font-weight: 600; color: #2F5496; }
.sdoc .sh-en { font-size: 13px; font-weight: 700; color: #111; }
.sdoc .s-title { border-top: 2px solid #1F3864; margin-top: 10px; padding-top: 10px; text-align: center; color: #1F3864; font-weight: 700; font-size: 16px; }
.sdoc .s-title .kh { font-size: 18px; }
.sdoc table.s-meta { width: 100%; border-collapse: collapse; margin: 10px 0 8px; table-layout: fixed; }
.sdoc table.s-meta td:nth-child(1) { width: 15%; } .sdoc table.s-meta td:nth-child(3) { width: 21%; } .sdoc table.s-meta td:nth-child(4) { width: 26%; }
.sdoc table.s-meta td { border: 0; padding: 3px 4px; font-size: 11.5px; vertical-align: top; }
.sdoc table.s-meta .bt { color: #1F3864; font-weight: 700; }
.sdoc table.s-meta td:nth-child(2) { width: 38%; }
.sdoc table.s-meta .b { font-weight: 700; }
.sdoc table.s-meta .hl { background: #FEF9C3; }
.sdoc .blue { color: #0000FF; }
.sdoc table.s-items { width: 100%; border-collapse: collapse; }
.sdoc table.s-items th { background: #95B3D7; color: #000; border: 1px solid #000; font-size: 10.5px; font-weight: 700; text-align: center; padding: 3px; position: static; }
.sdoc table.s-items td { border: 1px solid #000; padding: 4px 5px; height: 22px; font-size: 11px; }
.sdoc td.c { text-align: center; }
.sdoc td.m span:first-child { float: left; }
.sdoc td.m span:last-child { float: right; }
.sdoc table.s-tot { width: 100%; border-collapse: collapse; }
.sdoc table.s-tot td { border: 1px solid #000; padding: 4px 5px; font-size: 11px; }
.sdoc table.s-tot td.st { border: 0; width: 49%; vertical-align: middle; font-weight: 700; font-size: 14px; }
.sdoc table.s-tot td.st.note { font-size: 10px; font-weight: 400; vertical-align: top; padding-right: 12px; }
.sdoc table.s-tot td.tl { text-align: right; width: 31%; }
.sdoc table.s-tot td.b { font-weight: 700; }
.sdoc table.s-tot td.tot-hl { background: #E0E7FF; }
.sdoc .po { margin-top: 22px; font-size: 11px; }
.sdoc .po-h { font-weight: 700; text-decoration: underline; margin-bottom: 4px; }
.sdoc .po-p { margin: 3px 0 3px 6px; }
.sdoc .po-t { border-collapse: collapse; margin: 2px 0 6px 6px; }
.sdoc .po-t td { border: 0; padding: 1px 8px 1px 0; font-size: 11px; }
.sdoc .po-t.ind { margin-left: 70px; }
.sdoc .s-sign { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; margin-top: 56px; color: #64748B; }
.sdoc .s-sign div { border-top: 1px solid #333; padding-top: 3px; text-align: center; margin: 0 30px; }
.sdoc.rcp { width: 196mm; font-size: 10.5px; }
.sdoc .r-top { display: flex; justify-content: space-between; align-items: center; }
.sdoc .r-top img { height: 48px; }
.sdoc .r-title { font-family: "Century Gothic", "IBM Plex Sans", Arial, sans-serif; font-size: 26px; font-weight: 700; color: #1F3864; text-align: right; }
.sdoc .r-title .kh { font-size: 13px; font-weight: 600; font-family: var(--font-print); }
.sdoc.rcp table.s-items td { height: 17px; padding: 2px 5px; }
.sdoc.rcp .s-sign { margin-top: 34px; font-size: 10px; color: #111; }

<script>
/* CamTech Fee Tracker – calculation engine.
 * Re-creates every ⚡ AUTO column of the Excel fee tracker (SOURCE-Log, Master, DB-Checking,
 * Report VP, AR reports, Daily report) from the hand-entered data. Runs in the browser and in Node (tests). */
(function (root) {
  "use strict";
  var DISC_CAT = "Discounts & Scholarships";
  var PLANS_DEFAULT = [1, 0.75, 0.6, 0.5, 0.4, 0.25];

  function num(v) { var n = Number(v); return v === "" || v === null || v === undefined || !isFinite(n) ? 0 : n; }
  function isNum(v) { return v !== "" && v !== null && v !== undefined && isFinite(Number(v)); }
  function addDays(ymd, n) {
    var d = new Date(Date.UTC(+ymd.slice(0, 4), +ymd.slice(5, 7) - 1, +ymd.slice(8, 10)) + n * 864e5);
    return d.toISOString().slice(0, 10);
  }
  function feeKey(s) { return String(s || "").trim().replace(/\s+/g, " ").toLowerCase(); }
  function round2(x) { return Math.round(x * 100) / 100; }
  /** Negative lines: "Discount" in the description (early-payment 3%, Discount 30%…) = discount; everything else
   *  (scholarships, assistantships, credits) = scholarship. */
  function isDiscount(l) { return /discount/i.test(String(l.fee || "")); }
  /** A tuition line: category Tuition Fee, or a description starting "Tuition fee" / "Tution fee" (typo in older data). */
  function isTuition(l) { return l.cat === "Tuition Fee" || /^\s*tu(i)?tion\s+fee/i.test(String(l.fee || "")); }

  /* --- schedule → study year and term group (AR by Term-Year) --- */
  function schedYear(s) { var m = String(s || "").match(/^\s*Y\s*(\d)/i); return m ? "Y" + m[1] : ""; }
  function schedTerm(s) {
    s = String(s || "");
    if (!s.trim()) return "";
    if (/I\s*,\s*II\s*,\s*III|I II III/i.test(s)) return "Full year (Term I,II,III)";
    if (/Term\s*II\s*\+\s*III/i.test(s)) return "Term II+III";
    if (/Term\s*I\s*\+\s*II\b/i.test(s)) return "Term I+II";
    if (/Term\s*III\)?\s*$/i.test(s)) return "Term III";
    if (/Term\s*II\)?\s*$/i.test(s)) return "Term II";
    if (/Term\s*I\)?\s*$/i.test(s)) return "Term I";
    return "Other";
  }

  /**
   * data: { students:[], lines:[], fees:[], majors:[], schools:[], rejects:[], settings:{terms, basis, plans} }
   * Records with status "Void" are ignored. today = "yyyy-mm-dd".
   */
  function build(data, today, opts) {
    opts = opts || {};
    var set = data.settings || {};
    var terms = isNum(set.terms) ? Number(set.terms) : 14;
    var basis = set.basis || "Enrolled (either)";
    var plans = (set.plans && set.plans.length ? set.plans : PLANS_DEFAULT).map(Number);
    var exactFee = !!opts.exactFeeMatch;   // Excel MATCH: case-insensitive, no trimming

    // fee list: first match wins (as Excel MATCH)
    var feeMap = {};
    (data.fees || []).forEach(function (f) {
      var k = exactFee ? String(f.desc || "").toLowerCase() : feeKey(f.desc);
      if (!k) return;
      // first match wins (Excel MATCH); a later duplicate is used only when the first one has no amount
      if (!feeMap[k] || (!exactFee && !isNum(feeMap[k].price) && isNum(f.price))) feeMap[k] = f;
    });
    var hsMap = {};
    (data.schools || []).forEach(function (h) { var k = feeKey(h.name); if (k && !hsMap[k]) hsMap[k] = h; });

    // reject / suspend: first active entry per Reg No (Excel MATCH)
    var rsMap = {};
    (data.rejects || []).forEach(function (r) { if (r.status === "Void" || !r.reg) return; if (!(r.reg in rsMap)) rsMap[r.reg] = r.rsStatus || ""; });

    var students = [], stuMap = {};
    (data.students || []).forEach(function (s) {
      if (s.status === "Void") return;
      var o = Object.assign({}, s);
      o.rs = rsMap[s.reg] || "";
      var h = s.hs ? hsMap[feeKey(s.hs)] : null;
      o.hsType = !String(s.hs || "").trim() ? "Not recorded" : h ? (h.type || "") : "Not in list";
      o.hsGroup = !String(s.hs || "").trim() ? "Not recorded" : h ? (h.group || "") : "Not in list";
      o.billed = 0; o.paid = 0; o.bal = 0; o.grossPos = 0; o.invoices = 0; o.receipts = 0; o.lastPaid = ""; o.tuiLines = 0; o.tuiPaid = 0; o.admPaid = 0; o.overdue = 0;
      students.push(o); stuMap[s.reg] = o;
    });

    var lines = [], seenRes = {}, seenPaidKey = {};
    (data.lines || []).forEach(function (l) {
      if (l.status === "Void") return;
      var o = Object.assign({}, l);
      var fee = o.fee || "";
      var f = fee ? feeMap[exactFee ? String(fee).toLowerCase() : feeKey(fee)] : null;

    var pre = String(S.cfg.regPrefix), max = 0;
    S.students.forEach(function (s) { if (String(s.reg).indexOf(pre) === 0) { var n = +String(s.reg).slice(pre.length); if (isFinite(n) && n > max) max = n; } });
    return pre + ("000000000" + (max + 1)).slice(-Math.max(num(S.cfg.digits) || 5, String(max + 1).length));
  }

  /* ---------------- void / restore (Admin) ---------------- */
  function voidDialog(kind, id, restore, what) {
    modal('<div class="mh"><h3>' + (restore ? "Restore " : "Void ") + esc(what) + '</h3><button class="btn small" data-close>✕</button></div>' +
      '<p class="muted">' + (restore ? "The record comes back into every total and report." : "Nothing is deleted. The record is marked Void, drops out of every total and report, and an Admin can restore it later. The reason is kept in the change history.") + "</p>" +
      '<label class="f">Reason · មូលហេតុ<input id="vReason" placeholder="Why?"></label><div class="err" id="vErr"></div><div class="mf"><button class="btn" data-close>Cancel</button><button class="btn ' + (restore ? "primary" : "danger") + '" id="vGo">' + (restore ? "Restore" : "Void") + "</button></div>", "narrow");
    $("vGo").onclick = function () {
      if (!$("vReason").value.trim()) { $("vErr").textContent = "Give a reason."; return; }
      $("vErr").textContent = "Saving…";
      api({ action: "void", kind: kind, id: id, restore: restore, reason: $("vReason").value }).then(function (j) { apply(j); closeModal(); notice((restore ? "Restored " : "Voided ") + esc(id) + ".", "good"); render(); })
        .catch(function (e) { $("vErr").textContent = errText(e); });
    };
  }

  /* =====================================================================================
   * INVOICES (SOURCE-Log lines grouped by invoice no. + the Invoice sheet)
   * ===================================================================================== */
  function invFilter() { return S.cache.invF || (S.cache.invF = { q: "", st: "", from: "", to: "", voided: false }); }
  RENDER.invoices = function (el) {
    var f = invFilter(), q = f.q.trim().toLowerCase(), list;
    if (f.voided) {
      var vg = {}; S.voidLines.forEach(function (l) { if (!l.inv) return; var g = vg[l.inv] || (vg[l.inv] = { inv: l.inv, issue: l.issue, reg: l.reg, name: (S.M.stuMap[l.reg] || {}).name || l.billTo || "", lines: [], total: 0, paid: 0, bal: 0, st: "Void" }); g.lines.push(l); });
      list = Object.keys(vg).map(function (k) { return vg[k]; });
    } else list = S.invList;
    list = list.filter(function (g) {
      if (f.st && g.st !== f.st) return false;
      if (f.from && (g.issue || "") < f.from) return false;
      if (f.to && (g.issue || "") > f.to) return false;
      if (q && (g.inv + " " + g.reg + " " + g.name).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var pg = pager("inv", list.length, 50), sum = { t: 0, p: 0, b: 0 };
    list.forEach(function (g) { sum.t += g.total; sum.p += g.paid; sum.b += g.bal; });
    el.innerHTML = '<div class="head"><div><h2>' + L("invoices") + "</h2><p>" + int(list.length) + " invoices · billed " + usd(sum.t) + " · paid " + usd(sum.p) + " · balance " + usd(sum.b) + '</p></div><div class="bar">' +
      (lvl("invoices") >= 2 ? '<button class="btn primary" id="iNew"><i class="ti ti-file-plus"></i> New invoice</button>' : "") +
      '<button class="btn" id="iXls"><i class="ti ti-file-spreadsheet"></i> Excel</button></div></div>' +
      '<div class="card tight bar"><label class="f" style="flex:1;min-width:220px">Search · ស្វែងរក<input id="iQ" value="' + esc(f.q) + '" placeholder="Invoice no., Reg No or name"></label>' +
      '<label class="f">' + L("status") + '<select id="iS">' + opts([["Unpaid", stLabel("Unpaid")], ["Overdue", stLabel("Overdue")], ["Paid", stLabel("Paid")], ["Check price", stLabel("Check price")], ["Rejected", stLabel("Rejected")]], f.st, "All") + "</select></label>" +
      '<label class="f">' + L("from") + '<input type="date" id="iF" value="' + esc(f.from) + '"></label><label class="f">' + L("to") + '<input type="date" id="iT" value="' + esc(f.to) + '"></label>' +
      (isAdmin() ? '<label class="small" style="display:flex;gap:6px;align-items:center;padding-bottom:8px"><input type="checkbox" id="iV" style="min-height:0"' + (f.voided ? " checked" : "") + "> Voided only</label>" : "") + "</div>" +
      '<div class="card tight"><div class="tbl-wrap"><table><thead><tr><th>' + L("invNo") + "</th><th>" + L("issue") + "</th><th>" + L("billTo") + '</th><th class="n">' + L("lines") + '</th><th class="n">' + L("total") + '</th><th class="n">' + L("paid") + '</th><th class="n">' + L("balance") + "</th><th>" + L("status") + "</th></tr></thead><tbody>" +
      (list.slice(pg.from, pg.to).map(function (g) {
        return '<tr class="click" data-inv="' + esc(g.inv) + '"><td>' + esc(g.inv) + "</td><td>" + fd(g.issue) + "</td><td>" + esc(g.name) + '<div class="small muted">' + esc(g.reg) + '</div></td><td class="n">' + g.lines.length +
          '</td><td class="n">' + usd(g.total) + '</td><td class="n">' + usd(g.paid, true) + '</td><td class="n ' + (g.bal > 0.005 ? "neg" : "") + '">' + usd(g.bal) + "</td><td>" + pill(g.st) + "</td></tr>";
      }).join("") || '<tr><td colspan="8" class="empty">No invoices match.</td></tr>') + "</tbody></table></div>" + pg.html + "</div>";
    var upd = debounce(function () { S.cache.invF = { q: $("iQ").value, st: $("iS").value, from: $("iF").value, to: $("iT").value, voided: $("iV") ? $("iV").checked : false }; S.cache.pg_inv = 0; var pos = $("iQ").selectionStart; render(); $("iQ").focus(); try { $("iQ").setSelectionRange(pos, pos); } catch (e) {} }, 250);
    $("iQ").oninput = upd; ["iS", "iF", "iT", "iV"].forEach(function (id) { if ($(id)) $(id).onchange = upd; });
    if ($("iNew")) $("iNew").onclick = function () { invoiceForm(null, ""); };
    $("iXls").onclick = function () {
      var rows = [[bi("invNo"), "Line", bi("reg"), bi("stuName"), bi("issue"), bi("due"), bi("desc"), bi("category"), bi("sched"), bi("qty"), bi("unit"), bi("total"), bi("datePaid"), bi("rcpNo"), bi("paid"), bi("balance"), bi("status"), bi("major"), bi("intake")]];
      list.forEach(function (g) { g.lines.forEach(function (l) { rows.push([l.inv, l.line, l.reg, l.name || l.billTo, l.issue, l.due, l.fee, l.cat, l.sched, l.qty, l.price, l.total, l.paidDate, l.rcp, l.paidN, l.bal, l.st, l.major, l.intake]); }); });
      exportXlsx("CamTech_Invoice_lines_" + today() + ".xlsx", [["Invoice lines", rows]]);
    };
    el.querySelectorAll("[data-inv]").forEach(function (r) { r.onclick = function () { var i = r.getAttribute("data-inv"); if (f.voided) voidedInvoice(i); else invoiceView(i); }; });
  };
  function voidedInvoice(inv) {
    var ls = S.voidLines.filter(function (l) { return l.inv === inv; });
    modal('<div class="mh"><h3>' + esc(inv) + " " + pill("Void") + '</h3><button class="btn small" data-close>✕</button></div><table><thead><tr><th>Line</th><th>' + L("desc") + "</th><th>" + L("rcpNo") + "</th><th>Voided by</th></tr></thead><tbody>" +
      ls.map(function (l) { return "<tr><td>" + esc(l.line) + "</td><td>" + esc(l.fee) + "</td><td>" + esc(l.rcp) + "</td><td>" + esc(l.updatedBy) + " · " + esc(String(l.updated).slice(0, 16)) + "</td></tr>"; }).join("") +
      '</tbody></table><div class="mf"><button class="btn primary" id="vrInv">Restore invoice</button></div>');

  function invoiceView(inv) {
    var g = S.inv[inv]; if (!g) { notice("Invoice " + esc(inv) + " not found.", "bad"); return; }
    var s = S.M.stuMap[g.reg], hasPay = g.lines.some(function (l) { return l.rcp || isNum(l.paid); });
    var canEdit = lvl("invoices") >= 2 && (!hasPay || isAdmin()), canPay = lvl("payments") >= 2 && g.lines.some(function (l) { return !l.rcp && !isNum(l.paid); });
    var rate = num(g.lines[0].rate) || num(S.cfg.rate);
    modal('<div class="mh"><h3>' + L("invoice") + " " + esc(inv) + " " + pill(g.st) + '</h3><button class="btn small" data-close>✕</button></div>' +
      '<div class="grid g2"><dl class="dl"><dt>' + L("billTo") + "</dt><dd>" + (g.reg ? '<a href="#" id="ivStu">' + esc(g.name) + " · " + esc(g.reg) + "</a>" : esc(g.name)) + "</dd><dt>" + L("major") + "</dt><dd>" + esc(s ? s.major + " · " + s.prog : "–") + "</dd><dt>" + L("intake") + "</dt><dd>" + esc(s ? s.intake : "–") + "</dd></dl>" +
      '<dl class="dl"><dt>' + L("issue") + "</dt><dd>" + fd(g.issue) + "</dd><dt>" + L("due") + "</dt><dd>" + fd(g.due) + "</dd><dt>" + L("sched") + "</dt><dd>" + esc(g.sched || "–") + "</dd><dt>" + L("rate") + "</dt><dd>" + khr(rate) + "</dd></dl></div>" +
      '<div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>' + L("no") + "</th><th>" + L("desc") + '</th><th class="n">' + L("qty") + '</th><th class="n">' + L("unit") + '</th><th class="n">' + L("amt") + '</th><th class="n">' + L("paid") + "</th><th>" + L("rcpNo") + '</th><th class="n">' + L("balance") + "</th><th>" + L("status") + "</th>" + (isAdmin() ? "<th></th>" : "") + "</tr></thead><tbody>" +
      g.lines.map(function (l) {
        return "<tr><td>" + esc(l.line) + "</td><td>" + esc(l.fee) + '<div class="small muted">' + esc(l.cat || "not in Fee types") + (isNum(l.ovr) ? " · price set on this line" : "") + '</div></td><td class="n">' + esc(isNum(l.qty) ? l.qty : 1) + '</td><td class="n">' + (l.price === "" ? "?" : usd(l.price)) +
          '</td><td class="n">' + usd(l.total) + '</td><td class="n">' + usd(l.paidN, true) + "</td><td>" + esc(l.rcp) + (l.paidDate ? '<div class="small muted">' + fd(l.paidDate) + "</div>" : "") + '</td><td class="n">' + usd(l.bal) + "</td><td>" + pill(l.st) + "</td>" +
          (isAdmin() ? "<td>" + (l.rcp || isNum(l.paid) ? '<button class="btn small" data-clr="' + esc(l.id) + '" title="Take the payment off this line">Clear payment</button>' : "") + "</td>" : "") + "</tr>";
      }).join("") +
      '<tr class="tot"><td colspan="4">' + L("totalUSD") + '</td><td class="n">' + usd(g.total) + '</td><td class="n">' + usd(g.paid) + '</td><td></td><td class="n">' + usd(g.bal) + "</td><td></td>" + (isAdmin() ? "<td></td>" : "") + "</tr></tbody></table></div>" +
      (g.lines[0].notes ? '<p class="small muted">' + esc(g.lines[0].notes) + "</p>" : "") +
      '<div class="mf">' + (isAdmin() ? '<button class="btn danger" id="ivVoid">Void invoice</button>' : "") +
      '<button class="btn" id="ivPrint"><i class="ti ti-printer"></i> Print invoice</button>' +
      (lvl("email") >= 2 ? '<button class="btn" id="ivMail"><i class="ti ti-mail"></i> Email</button>' : "") +
      (canEdit ? '<button class="btn" id="ivEdit"><i class="ti ti-edit"></i> Edit</button>' : (lvl("invoices") >= 2 && hasPay ? '<span class="small muted" style="align-self:center">Has a payment: only an Admin can edit.</span>' : "")) +
      (canPay ? '<button class="btn primary" id="ivPay"><i class="ti ti-cash"></i> Record payment</button>' : "") + "</div>");
    if ($("ivStu")) $("ivStu").onclick = function (ev) { ev.preventDefault(); studentProfile(g.reg); };
    $("ivPrint").onclick = function () { printInvoice(g); };
    if ($("ivMail")) $("ivMail").onclick = function () { emailInvoice(g); };
    if ($("ivEdit")) $("ivEdit").onclick = function () { invoiceForm(inv, g.reg); };
    if ($("ivPay")) $("ivPay").onclick = function () { paymentForm(g.reg, inv); };
    if ($("ivVoid")) $("ivVoid").onclick = function () { voidDialog("invoice", inv, false, "invoice " + inv + " (all " + g.lines.length + " lines)"); };
    document.querySelectorAll("#modalBg [data-clr]").forEach(function (b) { b.onclick = function () { clearPaymentDialog(b.getAttribute("data-clr")); }; });
  }

  function clearPaymentDialog(id) {
    var l = S.lines.filter(function (x) { return x.id === id; })[0];
    modal('<div class="mh"><h3>Clear payment · ' + esc(l.inv) + "-" + esc(l.line) + '</h3><button class="btn small" data-close>✕</button></div><p>' + esc(l.fee) + ": receipt <b>" + esc(l.rcp || "–") + "</b>, " + fd(l.paidDate) + ", USD " + usd(l.paid) +
      '.</p><p class="muted small">The payment comes off this line, so the line shows as unpaid again. The old receipt details are kept in the change history.</p><label class="f">Reason · មូលហេតុ<input id="cpR"></label><div class="err" id="cpE"></div><div class="mf"><button class="btn" data-close>Cancel</button><button class="btn danger" id="cpGo">Clear payment</button></div>', "narrow");
    $("cpGo").onclick = function () {
      if (!$("cpR").value.trim()) { $("cpE").textContent = "Give a reason."; return; }
      $("cpE").textContent = "Saving…";
      api({ action: "clearPayment", id: id, updated: l.updated, reason: $("cpR").value }).then(function (j) { apply(j); closeModal(); notice("Payment cleared from " + esc(l.inv) + "-" + esc(l.line) + ".", "good"); render(); if (S.inv[l.inv]) invoiceView(l.inv); })
        .catch(function (e) { $("cpE").textContent = errText(e); });
    };
  }

  function nextNo(field, prefix, date) {
    var list = S.lines.map(function (l) { return l[field]; });
    return CT.nextNo(list, String(prefix), date || today(), num(S.cfg.digits) || 5);
  }
  function stuOptions() {
    if (!S.cache.stuDl) S.cache.stuDl = S.M.students.map(function (s) { return '<option value="' + esc(s.reg) + '">' + esc(s.name + " · " + s.major + " · " + s.intake) + "</option>"; }).join("");
    return S.cache.stuDl;
  }

  function invoiceForm(inv, reg) {
    S.cache.stuDl = null;
    var g = inv ? S.inv[inv] : null, isNew = !g;
    var first = g ? g.lines[0] : {};
    var scheds = uniq(S.M.lines.map(function (l) { return l.sched; })).slice(0, 300);
    var rows = g ? g.lines.map(function (l) { return { id: l.id, fee: l.fee, qty: l.qty, ovr: l.ovr, updated: l.updated }; }) : [{ fee: "", qty: "", ovr: "" }];
    modal('<div class="mh"><h3>' + (isNew ? "New invoice · វិក្កយបត្រថ្មី" : "Edit invoice · កែប្រែវិក្កយបត្រ " + esc(inv)) + '</h3><button class="btn small" data-close>✕</button></div><div class="form">' +
      '<label class="f">' + L("invNo") + '<input id="nInv" value="' + esc(inv || "") + '"' + (isNew ? ' placeholder="Next: ' + esc(nextNo("inv", S.cfg.invPrefix, today())) + '"' : " readonly") + "></label>" +
      '<label class="f">' + L("reg") + '<input id="nReg" list="dlStu" value="' + esc(reg || (g ? g.reg : "")) + '" placeholder="Type Reg No or name"><datalist id="dlStu">' + stuOptions() + '</datalist><span class="small muted" id="nStuName"></span></label>' +
      '<label class="f">Bill to (not a student) · ចេញជូន<input id="nBill" value="' + esc(first.billTo || "") + '" placeholder="Tenant, company…"></label>' +
      '<label class="f">' + L("issue") + '<input type="date" id="nIss" value="' + esc(g ? g.issue : today()) + '"></label>' +
      '<label class="f">' + L("sched") + '<input id="nSch" list="dlSch" value="' + esc(first.sched || "") + '" placeholder="e.g. Y1-Term I"><datalist id="dlSch">' + scheds.map(function (x) { return '<option value="' + esc(x) + '">'; }).join("") + "</datalist></label>" +
      '<label class="f">' + L("rate") + '<input type="number" id="nRate" value="' + esc(isNum(first.rate) ? first.rate : S.cfg.rate) + '"></label>' +
      '<label class="f wide">' + L("notes") + '<input id="nNotes" value="' + esc(first.notes || "") + '"></label></div>' +
      '<h3 style="margin-top:14px">Lines · ជួរ</h3><div class="tbl-wrap"><table class="ln-grid"><thead><tr><th style="width:38%">' + L("fee") + "</th><th>" + L("category") + '</th><th class="n">List price</th><th class="n" style="width:80px">' + L("qty") + '</th><th class="n" style="width:110px">Price override</th><th class="n">' + L("amt") + '</th><th></th></tr></thead><tbody id="nLines"></tbody>' +
      '<tfoot><tr class="tot"><td colspan="5">' + L("totalUSD") + '</td><td class="n" id="nTot"></td><td></td></tr></tfoot></table></div>' +
      '<datalist id="dlFee">' + S.feeActive.map(function (f) { return '<option value="' + esc(f.desc) + '">' + esc((isNum(f.price) ? usd(f.price) : "no price") + " · " + f.cat) + "</option>"; }).join("") + "</datalist>" +
      '<button class="btn small" id="nAdd" style="margin-top:6px"><i class="ti ti-plus"></i> Add line</button>' +
      '<p class="small muted">Scholarships and discounts are lines with a negative price (category “Discounts &amp; Scholarships”). Use “Price override” only when the price differs from the Fee types list.</p>' +
      '<div class="err" id="nErr"></div><div class="mf"><button class="btn" data-close>Cancel</button><button class="btn primary" id="nSave"><i class="ti ti-device-floppy"></i> Save invoice</button></div>');
    function feeOf(d) { return d ? S.M.feeMap[String(d).trim().replace(/\s+/g, " ").toLowerCase()] : null; }
    var drawing = false;
    function syncRows() { document.querySelectorAll("#nLines [data-k]").forEach(function (t) { var r = rows[+t.getAttribute("data-i")]; if (r) r[t.getAttribute("data-k")] = t.value; }); }
    function drawLines() {
      if (drawing) return;
      drawing = true;
      try { syncRows(); var ae = document.activeElement; if (ae && $("nLines").contains(ae)) ae.blur(); drawLinesNow(); } finally { drawing = false; }
    }
    function drawLinesNow() {
      $("nLines").innerHTML = rows.map(function (r, i) {
        var f = feeOf(r.fee), price = isNum(r.ovr) ? Number(r.ovr) : f && isNum(f.price) ? Number(f.price) : "", amt = price === "" ? "" : (isNum(r.qty) ? Number(r.qty) : 1) * price;
        return '<tr><td><input data-k="fee" data-i="' + i + '" list="dlFee" value="' + esc(r.fee) + '"></td><td class="small">' + esc(f ? f.cat : r.fee ? "Not in Fee types" : "") + '</td><td class="n">' + (f && isNum(f.price) ? usd(f.price) : r.fee ? "?" : "") +
          '</td><td><input data-k="qty" data-i="' + i + '" type="number" step="0.5" placeholder="1" value="' + esc(r.qty) + '"></td><td><input data-k="ovr" data-i="' + i + '" type="number" step="0.01" value="' + esc(r.ovr) + '"></td><td class="n">' + (amt === "" ? '<span class="neg">Check price</span>' : usd(amt)) +
          '</td><td><button class="btn small" data-del="' + i + '" title="Remove line">✕</button></td></tr>';
      }).join("");
      var t = 0; rows.forEach(function (r) { var f = feeOf(r.fee), p = isNum(r.ovr) ? Number(r.ovr) : f && isNum(f.price) ? Number(f.price) : 0; t += (isNum(r.qty) ? Number(r.qty) : 1) * p; });
      $("nTot").textContent = usd(t);
    }
    drawLines();
    function showName() { var s = S.M.stuMap[$("nReg").value.trim()]; $("nStuName").textContent = s ? s.name + " · " + schPct(s.schol) + " scholarship" : ($("nReg").value.trim() ? "Not in the student list" : ""); }
    showName(); $("nReg").oninput = showName;
    $("nLines").addEventListener("change", function (ev) { var t = ev.target.closest("[data-k]"); if (!t) return; rows[+t.getAttribute("data-i")][t.getAttribute("data-k")] = t.value; drawLines(); });
    $("nLines").addEventListener("click", function (ev) { var b = ev.target.closest("[data-del]"); if (!b) return; syncRows(); rows.splice(+b.getAttribute("data-del"), 1); if (!rows.length) rows.push({ fee: "", qty: "", ovr: "" }); drawLines(); });
    $("nAdd").onclick = function () { syncRows(); rows.push({ fee: "", qty: "", ovr: "" }); drawLines(); var ins = $("nLines").querySelectorAll('[data-k="fee"]'); ins[ins.length - 1].focus(); };
    $("nSave").onclick = function () {
      syncRows();
      var r = $("nReg").value.trim();
      if (r && !S.M.stuMap[r]) { $("nErr").textContent = "Reg No " + r + " is not in the student list. Add the student first, or leave Reg No blank and fill in Bill to."; return; }
      var unknown = rows.filter(function (x) { return x.fee.trim() && !feeOf(x.fee) && !isNum(x.ovr); });
      if (unknown.length && !confirm(unknown.length + " line(s) use a fee that is not in the Fee types list and have no price override, so they will show “Check price”. Save anyway?")) return;
      var payload = { inv: $("nInv").value.trim(), isNew: isNew, reg: r, billTo: $("nBill").value, issue: $("nIss").value, sched: $("nSch").value, rate: $("nRate").value, notes: $("nNotes").value, lines: rows };
      $("nErr").textContent = "Saving…"; setSync("busy", "Saving…");
      api({ action: "saveInvoice", invoice: payload }).then(function (j) {
        apply(j); closeModal(); notice("Invoice " + esc(j.inv) + " saved.", "good"); render(); invoiceView(j.inv);
      }).catch(function (e) { $("nErr").textContent = errText(e); setSync("err", "Not saved"); });
    };
  }

  function payOptsHtml() {

      var k = g.reg || "name:" + g.name;
      var r = by[k] || (by[k] = { key: k, reg: g.reg, name: g.name, invs: [], bal: 0, maxLate: 0, email: emailOf(g.reg) });
      r.invs.push(g); r.bal += g.bal; r.maxLate = Math.max(r.maxLate, daysLate(g.due));
    });
    return Object.keys(by).map(function (k) { return by[k]; }).filter(function (r) {
      if (f.withEmail && !r.email) return false;
      if (q && (r.reg + " " + r.name + " " + r.email).toLowerCase().indexOf(q) < 0) return false;
      if (f.minDays && r.maxLate < num(f.minDays)) return false;
      return true;
    }).sort(function (a, b) { return b.maxLate - a.maxLate || b.bal - a.bal; });
  }
  function alSend(el) {
    var f = S.cache.alF || (S.cache.alF = { kind: "overdue", days: 7, minDays: "", q: "", withEmail: false });
    var rows = alRows(f), canSend = lvl("email") >= 2, sel = S.cache.alSel || (S.cache.alSel = {});
    var withMail = rows.filter(function (r) { return r.email; }).length, pg = pager("al", rows.length, 50);
    el.innerHTML = '<div class="card tight bar" style="margin-top:10px">' +
      '<label class="f">Show · បង្ហាញ<select id="alK">' + opts([["overdue", "Overdue · ហួសកំណត់"], ["soon", "Due soon · ជិតដល់ថ្ងៃកំណត់"], ["all", "All open balances · សមតុល្យទាំងអស់"]], f.kind) + "</select></label>" +
      (f.kind === "soon" ? '<label class="f">Due within (days)<input id="alD" type="number" min="1" value="' + esc(f.days) + '" style="width:90px"></label>' : "") +
      (f.kind === "overdue" ? '<label class="f">At least (days late)<input id="alM" type="number" min="0" value="' + esc(f.minDays) + '" style="width:90px" placeholder="any"></label>' : "") +
      '<label class="f" style="flex:1;min-width:200px">Search · ស្វែងរក<input id="alQ" value="' + esc(f.q) + '" placeholder="Reg No, name or email"></label>' +
      '<label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="alW" style="min-height:0"' + (f.withEmail ? " checked" : "") + "> Only with an email address</label></div>" +
      '<div class="card tight" style="margin-top:10px"><div class="bar" style="justify-content:space-between"><div class="small muted">' + int(rows.length) + " people · " + int(withMail) + " with an email address · USD " + usd(rows.reduce(function (a, r) { return a + r.bal; }, 0)) + " open" + "</div>" +
      (canSend ? '<button class="btn primary" id="alGo"><i class="ti ti-mail"></i><span>Prepare emails for selected (<b id="alN">0</b>)</span></button>' : "") + "</div>" +
      (withMail ? "" : '<p class="small" style="background:#fff7e6;border:1px solid #f3d08a;padding:8px 10px;border-radius:8px">No email addresses are on the student records yet. Add them on the Students tab (Edit → Email), import them into the Email column of the Students tab, or type the address when you email one person.</p>') +
      '<div class="tbl-wrap"><table><thead><tr>' + (canSend ? '<th class="c"><input type="checkbox" id="alAll" style="min-height:0" title="Select all with email"></th>' : "") + "<th>" + L("reg") + "</th><th>" + L("name") + "</th><th>" + L("email") + '</th><th class="n">Invoices</th><th class="n">Days late</th><th class="n">' + L("balance") + "</th><th></th></tr></thead><tbody>" +
      (rows.slice(pg.from, pg.to).map(function (r) {
        return "<tr>" + (canSend ? '<td class="c"><input type="checkbox" data-k="' + esc(r.key) + '" style="min-height:0"' + (r.email ? "" : " disabled") + (sel[r.key] ? " checked" : "") + "></td>" : "") +
          "<td>" + esc(r.reg || "–") + "</td><td>" + esc(r.name) + (r.reg ? "" : ' <span class="small muted">(no Reg No)</span>') + "</td><td>" + (r.email ? esc(r.email) : '<span class="muted small">none</span>') + '</td><td class="n">' + r.invs.length + '</td><td class="n ' + (r.maxLate > 0 ? "neg" : "") + '">' + (r.maxLate > 0 ? int(r.maxLate) : "–") + '</td><td class="n">' + usd(r.bal) + "</td>" +
          "<td>" + (canSend ? '<button class="btn small" data-one="' + esc(r.key) + '"><i class="ti ti-mail"></i> Prepare</button>' : "") + "</td></tr>";
      }).join("") || '<tr><td colspan="8" class="empty">Nobody matches.</td></tr>') + "</tbody></table></div>" + pg.html + "</div>" +
      '<p class="small muted">The Fee Tracker never sends email itself. Prepare builds the message (Khmer + English, open invoices, bank details); you send it from your own Gmail or Outlook and click Mark as sent to record it. A default CC and the signature line can be set under Admin → Settings (items “Email CC”, “Email signature”).</p>';
    var map = {}; rows.forEach(function (r) { map[r.key] = r; });
    function count() { var n = Object.keys(sel).filter(function (k) { return sel[k] && map[k] && map[k].email; }).length; if ($("alN")) $("alN").textContent = n; return n; }
    var upd = debounce(function () { S.cache.alF = { kind: $("alK").value, days: $("alD") ? $("alD").value : f.days, minDays: $("alM") ? $("alM").value : f.minDays, q: $("alQ").value, withEmail: $("alW").checked }; S.cache.pg_al = 0; var pos = $("alQ").selectionStart, focusQ = document.activeElement === $("alQ"); render(); if (focusQ) { $("alQ").focus(); try { $("alQ").setSelectionRange(pos, pos); } catch (e) {} } }, 250);
    $("alQ").oninput = upd; ["alK", "alD", "alM", "alW"].forEach(function (id) { if ($(id)) $(id).onchange = upd; });
    el.querySelectorAll("[data-k]").forEach(function (c) { c.onchange = function () { sel[c.getAttribute("data-k")] = c.checked; count(); }; });
    if ($("alAll")) $("alAll").onchange = function () { var on = $("alAll").checked; rows.forEach(function (r) { if (r.email) sel[r.key] = on; }); el.querySelectorAll("[data-k]").forEach(function (c) { if (!c.disabled) c.checked = on; }); count(); };
    el.querySelectorAll("[data-one]").forEach(function (b) { b.onclick = function () { var r = map[b.getAttribute("data-one")]; emailCompose({ type: r.maxLate > 0 ? "overdue" : "reminder", reg: r.reg, name: r.name, invs: r.invs }); }; });
    count();
    if ($("alGo")) $("alGo").onclick = function () {
      var list = rows.filter(function (r) { return sel[r.key] && r.email; });
      if (!list.length) { notice("Tick the people to email first (only those with an email address can be ticked).", "info"); return; }
      bulkDialog(list);
    };
  }
  /** Step through the ticked people one by one: prepare, send from your mailbox, mark as sent, next. */
  function bulkDialog(list) {
    var i = 0, done = 0;
    function show() {
      if (i >= list.length) { closeModal(); notice(done + " of " + list.length + " recorded as sent. See Sent emails.", "good", 7000); render(); return; }
      var r = list[i];
      emailCompose({ type: r.maxLate > 0 ? "overdue" : "reminder", reg: r.reg, name: r.name, invs: r.invs, to: r.email }, { i: i, n: list.length, next: function (ok) { if (ok) { done++; S.cache.alSel[r.key] = false; } i++; show(); } });
    }
    show();
  }
  function alLog(el) {
    el.innerHTML = '<div class="card" style="margin-top:10px"><div class="bar"><label class="f" style="flex:1">Filter · តម្រង<input id="elQ" placeholder="Email, Reg No, invoice no., subject…"></label><span class="small muted" id="elQt"></span></div><div id="elT" class="tbl-wrap" style="margin-top:10px">Loading…</div></div>';
    api({ action: "emailLog", limit: 1000 }).then(function (j) {
      function draw() {
        var q = $("elQ").value.toLowerCase();
        var rows = j.log.filter(function (r) { return !q || r.join(" ").toLowerCase().indexOf(q) >= 0; });
        $("elT").innerHTML = rows.length ? "<table><thead><tr><th>Time</th><th>Recorded by</th><th>To</th><th>CC</th><th>Subject</th><th>Type</th><th>Reg No</th><th>Invoice / receipt</th><th>Result</th></tr></thead><tbody>" +
          rows.slice(0, 500).map(function (r) { return "<tr>" + r.map(function (v, i) { return "<td" + (i === 4 ? ' class="small"' : "") + ">" + (i === 8 ? '<span style="color:#16a34a">' + esc(v) + "</span>" : esc(v)) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table>"
          : '<div class="empty">No emails recorded yet.</div>';
      }
      draw(); $("elQ").oninput = debounce(draw, 200);
    }).catch(function (e) { $("elT").textContent = errText(e); });
  }
  /* ---------------- start ---------------- */
  (function init() {
    try { S.token = localStorage.getItem(LS_TOK) || sessionStorage.getItem(LS_TOK) || ""; } catch (e) {}
    if (API_URL.indexOf("http") !== 0) { showLogin(errText({ code: "nourl" })); return; }
    if (S.token) load(false); else showLogin("");
  })();

  window.CTFT = { S: S };   // for troubleshooting from the browser console
})();

</script>
